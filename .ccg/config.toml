[general]
version = "3.1.1"
language = "en"
createdAt = "2026-05-24T15:59:57.173Z"

[routing]
mode = "smart"
geminiModel = "Gemini 3.5 Flash (Medium)"

[routing.frontend]
models = [ "antigravity" ]
primary = "antigravity"
strategy = "fallback"

[routing.backend]
models = [ "claude" ]
primary = "claude"
strategy = "fallback"

[routing.review]
models = [ "antigravity", "claude" ]
strategy = "parallel"

[workflows]
installed = [ "workflow", "plan", "execute", "team", "team-research", "team-plan", "team-exec", "team-review", "frontend", "claude-exec", "context", "backend", "feat", "analyze", "debug", "optimize", "test", "review", "enhance", "init-project", "commit", "rollback", "clean-branches", "worktree", "spec-init", "spec-research", "spec-plan", "spec-impl", "spec-review" ]

[paths]
commands = "/home/pc/.claude/commands/ccg"
prompts = "/home/pc/.claude/.ccg/prompts"
backup = "/home/pc/.claude/.ccg/backup"

[mcp]
provider = "gitnexus"
setup_url = "https://gitnexus.com/"

[performance]
liteMode = false
skipImpeccable = true
